const ROOM_TYPES=['精緻','商務','豪華','總統'];
function nightDates(start,end){return days(start,end,true)}
async function roomAvailability(start,end,excludeId=null){
 if(!start||!end||end<=start)throw new Error('請先選擇正確的入住及退宿日期');
 const nights=nightDates(start,end);if(!nights.length||nights.length>119)throw new Error('住宿日期不可超過119晚');
 const [rr,bb]=await Promise.all([
  db.from('rooms').select('id,room_type,room_number,active').eq('active',true),
  db.from('bookings').select('id,room_type,room_id,start_date,end_date,status').eq('booking_type','boarding').eq('status','confirmed').lt('start_date',end).gt('end_date',start)
 ]);
 if(rr.error||bb.error)throw new Error(rr.error?.message||bb.error?.message);
 const activeRooms=rr.data||[], bookings=(bb.data||[]).filter(b=>b.id!==excludeId);
 const result={};
 for(const type of ROOM_TYPES){
  const typeRooms=activeRooms.filter(r=>r.room_type===type);
  const relevant=bookings.filter(b=>b.room_type===type);
  const peak=Math.max(0,...nights.map(day=>relevant.filter(b=>b.start_date<=day&&day<b.end_date).length));
  const available=typeRooms.filter(r=>!bookings.some(b=>b.room_id===r.id&&b.start_date<end&&b.end_date>start));
  result[type]={total:typeRooms.length,remaining:Math.max(0,typeRooms.length-peak),rooms:available};
 }
 return result;
}

=>o.id===dog?.owner_id),a=x.activity;return `<article><strong>${safe(dog?.name||'未知狗狗')}</strong> <span class="pill">${x.booking_type==='boarding'?'住宿':'安親'}</span> <span class="pill">${safe(a?.academy||'未指定學院')}</span><div>${safe(owner?.full_name||'')} · ${safe(owner?.phone||'無電話')} · ${safe(dog?.breed||'')}</div><div class="muted">${safe(x.start_date)} 至 ${safe(x.end_date)} ${x.room_type?'· '+safe(x.room_type)+'套房':''} </div><div>${a?.swimming?'游泳 · ':''}${safe(a?.elective||'')}${a?.old_ticket_course?' · 舊票卡加購：'+safe(a.old_ticket_course):''}${a?.after_swim_service?' · 課後'+safe(a.after_swim_service):''}</div><div class="actions"><button class="secondary" type="button" data-edit="${safe(x.id)}">修改課程／接送</button><button class="danger" type="button" data-cancel="${safe(x.id)}">取消預約</button></div><div class="editbox hidden" id="edit-${safe(x.id)}"></div></article>`}).join('')}async function dashboard(){try{const r=await records(today);$('stats').innerHTML=`<span class="pill">今日 ${r.length} 隻</span><span class="pill">安親 ${r.filter(x=>x.booking_type==='daycare').length}</span><span class="pill">住宿 ${r.filter(x=>x.booking_type==='boarding').length}</span><span class="pill">游泳 ${r.filter(x=>x.activity?.swimming).length}</span>`+['騎士','精靈','貴族','舊票卡'].map(n=>`<span class="pill">${n} ${r.filter(x=>x.activity?.academy===n).length}</span>`).join('');$('todayList').innerHTML=render(r);if(!$('calendar').classList.contains('hidden'))loadCalendar()}catch(e){msg(e.message,true)}}let calendarMonth=today.slice(0,7),calendarSelected=today,calendarRequest=0;
function monthShift(value,delta){const [y,m]=value.split('-').map(Number);const d=new Date(y,m-1+delta,1);return fmt(d).slice(0,7)}
function calendarSummary(rows){return `<span class="pill">共 ${rows.length} 隻</span><span class="pill">安親 ${rows.filter(x=>x.booking_type==='daycare').length}</span><span class="pill">住宿 ${rows.filter(x=>x.booking_type==='boarding').length}</span><span class="pill">游泳 ${rows.filter(x=>x.activity?.swimming).length}</span>`+['騎士','精靈','貴族','舊票卡'].map(n=>`<span class="pill">${n} ${rows.filter(x=>x.activity?.academy===n).length}</span>`).join('')}
async function loadCalendar(){
 const request=++calendarRequest,month=calendarMonth,[year,mon]=month.split('-').map(Number),first=month+'-01',next=monthShift(month,1)+'-01';
 $('calTitle').textContent=`${year} 年 ${mon} 月`;$('calStatus').textContent='正在載入整個月份的預約…';$('calGrid').innerHTML='';$('calCounts').innerHTML='';$('calList').innerHTML='';
 try{
  const [br,ar]=await Promise.all([
   db.from('bookings').select('id,dog_id,booking_type,start_date,end_date,room_type,room_id,status,arrival_method,departure_method').eq('status','confirmed').lt('start_date',next).gte('end_date',first).order('start_date'),
   db.from('daily_activities').select('booking_id,activity_date,academy,swimming,elective,after_swim_service,old_ticket_course').gte('activity_date',first).lt('activity_date',next)
  ]);
  if(br.error||ar.error)throw br.error||ar.error;
  if(request!==calendarRequest)return;
  const bookings=br.data||[],activities=ar.data||[],activityMap=new Map(activities.map(a=>[a.booking_id+'|'+a.activity_date,a]));
  const countDays=new Date(year,mon,0).getDate(),offset=new Date(year,mon-1,1).getDay(),byDay={};
  for(let day=1;day<=countDays;day++){
   const date=month+'-'+String(day).padStart(2,'0');
   byDay[date]=bookings.filter(b=>b.start_date<=date&&(b.booking_type==='boarding'?date<b.end_date:date===b.start_date)).map(b=>({...b,activity:activityMap.get(b.id+'|'+date)}));
  }
  $('calGrid').innerHTML=['日','一','二','三','四','五','六'].map(n=>`<div class="calendar-weekday">${n}</div>`).join('')+Array.from({length:offset},()=>'<div class="calendar-empty"></div>').join('')+Array.from({length:countDays},(_,i)=>{const day=i+1,date=month+'-'+String(day).padStart(2,'0'),r=byDay[date];return `<button type="button" class="calendar-day ${date===today?'today':''} ${date===calendarSelected?'selected':''}" data-cal-date="${date}" aria-label="${date}，${r.length} 隻預約"><span>${day}</span><small>${r.length} 隻</small></button>`}).join('');
  $('calStatus').textContent='點選日期即可查看預約明細。住宿退宿日不列入住房統計。';
  function selectDay(date){calendarSelected=date;document.querySelectorAll('[data-cal-date]').forEach(b=>b.classList.toggle('selected',b.dataset.calDate===date));$('calSelectedTitle').textContent=`${date} 預約明細`;$('calCounts').innerHTML=calendarSummary(byDay[date]||[]);$('calList').innerHTML=render(byDay[date]||[])}
  $('calGrid').onclick=e=>{const btn=e.target.closest('[data-cal-date]');if(btn)selectDay(btn.dataset.calDate)};
  selectDay(calendarSelected.startsWith(month)?calendarSelected:first);
 }catch(e){if(request===calendarRequest)$('calStatus').textContent='月曆載入失敗：'+e.message}
}
$('calPrev').onclick=()=>{calendarMonth=monthShift(calendarMonth,-1);calendarSelected=calendarMonth+'-01';loadCalendar()};
$('calNext').onclick=()=>{calendarMonth=monthShift(calendarMonth,1);calendarSelected=calendarMonth+'-01';loadCalendar()};
async function search(){try{const date=$('filterDate').value||today;const text=$('filterText').value.trim().toLowerCase();const r=await records(date);$('searchList').innerHTML=render(r.filter(x=>{const d=dogs.find(d=>d.id===x.dog_id),o=owners.find(o=>o.id===d?.owner_id);return !text||[d?.name,d?.breed,o?.full_name,o?.phone?.slice(-3)].some(v=>v?.toLowerCase().includes(text))}))}catch(e){msg(e.message,true)}}$('searchBtn').onclick=search;
// Event delegation ensures buttons work after lists are re-rendered.
let editingBusy=false;
function editSelect(label, field, choices, selected){return `<label>${label}<select data-field="${field}">${choices.map(([v,t])=>`<option value="${safe(v)}" ${v===(selected||'')?'selected':''}>${safe(t)}</option>`).join('')}</select></label>`}
async function openEdit(id){
 const box=document.getElementById('edit-'+id);if(!box)return;
 if(!box.classList.contains('hidden')){box.classList.add('hidden');return}
 box.classList.remove('hidden');box.textContent='正在讀取預約資料…';
 const [b,a]=await Promise.all([db.from('bookings').select('*').eq('id',id).single(),db.from('daily_activities').select('*').eq('booking_id',id).order('activity_date')]);
 if(b.error||a.error){box.textContent='讀取失敗：'+(b.error?.message||a.error?.message);return}
 const booking=b.data,acts=a.data||[];
 if(booking.status!=='confirmed'){box.textContent='此預約已取消，不能修改。';return}
 const first=acts[0]||{};
 box.innerHTML=`<strong>修改預約</strong><p class="muted">課程設定會套用至本筆預約的所有活動日期。日期修改請使用下方獨立區塊。</p><div class="row">${editSelect('學院','academy',[['','不指定'],['騎士','騎士'],['精靈','精靈'],['貴族','貴族'],['舊票卡','舊票卡']],first.academy)}${editSelect('游泳','swimming',[['false','不游泳'],['true','加購游泳']],String(!!first.swimming))}${editSelect('游泳後服務','after_swim_service',[['','無'],['吹毛','吹毛'],['美容','美容']],first.after_swim_service)}${editSelect('到店方式','arrival_method',[['','未指定'],['家長自送','家長自送'],['娃娃車','娃娃車']],booking.arrival_method)}${editSelect('離店方式','departure_method',[['','未指定'],['家長自接','家長自接'],['娃娃車','娃娃車']],booking.departure_method)}</div><label>選修課<input data-field="elective" value="${safe(first.elective||'')}"></label><label>舊票卡加購課程（手動輸入）<input data-field="old_ticket_course" value="${safe(first.old_ticket_course||'')}" placeholder="可留空"></label><p><button type="button" data-save="${safe(id)}">儲存修改</button> <button type="button" class="secondary" data-close="${safe(id)}">關閉</button></p><p class="muted" data-editmsg></p>`;
 appendDateEditor(box,booking);
 if(booking.booking_type==='boarding')await appendRoomEditor(box,booking);
}

function appendDateEditor(box,booking){
 const section=document.createElement('div');section.className='editbox';
 section.innerHTML=`<strong>修改預約日期</strong><p class="muted">未變動日期的課程會保留；新日期會沿用學院與選修，但不自動安排游泳。住宿退宿日不計入課程。</p><div class="row"><label>${booking.booking_type==='boarding'?'入住日期':'安親日期'}<input type="date" data-date-start value="${safe(booking.start_date)}"></label>${booking.booking_type==='boarding'?`<label>退宿日期<input type="date" data-date-end value="${safe(booking.end_date)}"></label>`:''}</div><button type="button" data-date-save="${safe(booking.id)}">儲存日期修改</button><p class="muted" data-date-status></p>`;
 box.appendChild(section);
}
async function saveDateEdit(id,box){
 if(editingBusy)return;
 const section=box.querySelector('[data-date-save]').closest('.editbox');
 const button=section.querySelector('[data-date-save]'),status=section.querySelector('[data-date-status]');
 const start=section.querySelector('[data-date-start]').value;
 const end=section.querySelector('[data-date-end]')?.value||start;
 if(!start||!end||end<start||(section.querySelector('[data-date-end]')&&end===start)){
   status.textContent='請選擇正確的日期';status.className='error';return;
 }
 if(!confirm(`確定修改預約日期為 ${start} 至 ${end}？\n移除的日期將刪除對應課程，新日期不會自動安排游泳。`))return;
 editingBusy=true;button.disabled=true;status.textContent='正在修改日期…';
 try{
  const result=await db.rpc('change_booking_dates',{p_booking_id:id,p_start_date:start,p_end_date:end});
  if(result.error)throw result.error;
  status.textContent='日期修改成功！';status.className='ok';
  msg('日期修改成功！');await load();await dashboard();await search();
  if(!$('calendar').classList.contains('hidden'))await loadCalendar();
 }catch(e){status.textContent='修改失敗：'+e.message+'。原預約應維持不變，請重新查詢確認。';status.className='error'}
 finally{editingBusy=false;button.disabled=false}
}
async function appendRoomEditor(box,booking){
 const section=document.createElement('div');section.className='editbox';
 section.innerHTML='<strong>修改住宿房型</strong><p class="muted">只修改房型，不分配房號；入住與退宿日期不變。</p><label>房型<select data-roomtype>'+ROOM_TYPES.map(t=>`<option value="${t}" ${booking.room_type===t?'selected':''}>${t}套房</option>`).join('')+'</select></label><div data-roomstatus class="muted"></div><button type="button" data-room-save="'+safe(booking.id)+'">儲存房型</button>';
 box.appendChild(section);
 const typeSelect=section.querySelector('[data-roomtype]'),status=section.querySelector('[data-roomstatus]'),button=section.querySelector('[data-room-save]');
 async function refresh(){
  status.textContent='正在查詢房況…';button.disabled=true;
  try{const data=await roomAvailability(booking.start_date,booking.end_date,booking.id);const info=data[typeSelect.value];
   status.textContent=`${typeSelect.value}：剩 ${info.remaining}/${info.total} 間（不計本筆預約）`;
   button.disabled=info.remaining<=0;
  }catch(e){status.textContent='查詢失敗：'+e.message}
 }
 typeSelect.onchange=refresh;await refresh();
}
async function saveRoomAssignment(id,box){
 if(editingBusy)return;editingBusy=true;
 const section=box.querySelector('[data-roomtype]').closest('.editbox'),button=section.querySelector('[data-room-save]');button.disabled=true;
 const status=section.querySelector('[data-roomstatus]'),type=section.querySelector('[data-roomtype]').value;
 try{
  const current=await db.from('bookings').select('id,start_date,end_date,room_type,status').eq('id',id).single();if(current.error)throw current.error;
  if(current.data.status!=='confirmed')throw new Error('預約已取消');
  const available=await roomAvailability(current.data.start_date,current.data.end_date,id);
  if(available[type].remaining<=0)throw new Error('此房型已滿');
  const r=await db.from('bookings').update({room_type:type,room_id:null}).eq('id',id).eq('status','confirmed').select('id');if(r.error)throw r.error;
  if(!r.data?.length)throw new Error('預約不存在或已取消');
  msg('住宿房型修改成功！');await load();await dashboard();await search();
 }catch(e){status.textContent='儲存失敗：'+e.message+'。請重新查詢房況。';status.className='error'}finally{editingBusy=false;button.disabled=false}
}
async function saveEdit(id,box){
 if(editingBusy)return;editingBusy=true;const btn=box.querySelector('[data-save]');btn.disabled=true;
 const val=f=>box.querySelector(`[data-field="${f}"]`).value;
 const old_ticket_course=val('old_ticket_course').trim()||null;const academy=val('academy')||null,swimming=val('swimming')==='true',after_swim_service=val('after_swim_service')||null,elective=val('elective').trim()||null;
 const status=box.querySelector('[data-editmsg]');
 try{
  if(after_swim_service&&!swimming)throw new Error('請先選擇游泳，才能設定游泳後服務');
  // Update activity rows before booking transport. If swim capacity rejects the change, transport stays unchanged.
  const a=await db.from('daily_activities').update({academy,swimming,elective,after_swim_service,old_ticket_course}).eq('booking_id',id).select('id');
  if(a.error)throw a.error;
  if(!a.data?.length)throw new Error('找不到課程資料，未能修改');
  const b=await db.from('bookings').update({arrival_method:val('arrival_method')||null,departure_method:val('departure_method')||null}).eq('id',id).eq('status','confirmed').select('id');
  if(b.error)throw b.error;
  if(!b.data?.length)throw new Error('預約已取消或不存在');
  msg('預約修改成功！');await load();await dashboard();await search();
 }catch(e){status.textContent='修改未完成：'+e.message+'。若是住宿多日預約，請重新查詢確認每一天的內容。';status.className='error'}finally{editingBusy=false;btn.disabled=false}
}
async function cancelBooking(id){
 if(editingBusy)return;
 if(!confirm('確定要取消這筆預約嗎？\n取消後不會計入每日預約及房間名額。'))return;
 editingBusy=true;
 try{const r=await db.from('bookings').update({status:'cancelled'}).eq('id',id).eq('status','confirmed').select('id');if(r.error)throw r.error;if(!r.data?.length)throw new Error('預約不存在或已取消');msg('預約已取消');await dashboard();await search()}catch(e){msg('取消失敗：'+e.message,true)}finally{editingBusy=false}
}
document.addEventListener('click',async e=>{
 const edit=e.target.closest('[data-edit]'),cancel=e.target.closest('[data-cancel]'),save=e.target.closest('[data-save]'),close=e.target.closest('[data-close]'),roomSave=e.target.closest('[data-room-save]'),dateSave=e.target.closest('[data-date-save]');
 if(dateSave){await saveDateEdit(dateSave.dataset.dateSave,dateSave.closest('.editbox').parentElement)}else if(roomSave){await saveRoomAssignment(roomSave.dataset.roomSave,roomSave.closest('.editbox').parentElement)}else if(edit){await openEdit(edit.dataset.edit)}else if(cancel){await cancelBooking(cancel.dataset.cancel)}else if(save){await saveEdit(save.dataset.save,save.closest('.editbox'))}else if(close){document.getElementById('edit-'+close.dataset.close)?.classList.add('hidden')}
});
function loadSupabase(url){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=()=>window.supabase?.createClient?resolve():reject(new Error('程式庫未提供 Supabase 物件'));script.onerror=()=>reject(new Error('無法下載 '+url));document.body.appendChild(script)})}
async function init(){const status=$('debugMsg');try{let loaded=false;for(const url of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js']){try{status.textContent='正在連線 Supabase 元件…';await limit(loadSupabase(url),10000,'下載登入元件');loaded=true;break}catch(e){status.textContent='嘗試備用登入元件…'}}if(!loaded)throw new Error('登入元件下載失敗，請檢查 Safari 網路、內容阻擋器或換用行動網路');const cleanURL=SUPABASE_PROJECT_URL.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cleanURL))throw new Error('Supabase 專案網址格式不正確');db=window.supabase.createClient(cleanURL,KEY);loginBtn.disabled=false;status.textContent='登入程式已就緒，可以按下登入。';db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden')}});try{await limit(check(),15000,'初始化')}catch(err){status.textContent='初始化提示：'+err.message+'。仍可嘗試登入。'}}catch(err){status.textContent='初始化失敗：'+err.message+'。請確認目前頁面顯示 V1.7。';loginBtn.disabled=true}}
init();
